name: Despertador de Supabase (anti-pausa)

# Mantiene despierto el proyecto GRATUITO de Supabase. El plan free pausa el
# proyecto tras ~7 días sin actividad y, cuando eso pasa, la web pública se
# queda sin datos y nadie puede entrar ni ver las cuentas (ocurrió el
# 13/08/2026).
#
# Cómo funciona: una vez al día abre la página pública /transparencia. Esa
# página consulta la base de datos en cada carga (es `no-store`, siempre fresca),
# así que basta con visitarla para que Supabase registre actividad y NO se pause.
#
# Ventaja: NO necesita secrets ni service key, y NO requiere re-deploy en Netlify.
# Solo tiene que estar en la rama por defecto (main) para que el cron se active.
#
# Si algún día cambias el dominio de la web, actualiza WEB_URL abajo.

on:
  schedule:
    - cron: "17 7 * * *" # todos los días 07:17 UTC (02:17 en Lima)
  workflow_dispatch: {} # botón para lanzarlo a mano y probar al instante

permissions:
  contents: read

env:
  WEB_URL: "https://chardin177.netlify.app/transparencia"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Abrir la web pública para mantener la base despierta
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 \
            "${WEB_URL}?despertador=1") || code="000"
          echo "La web respondió HTTP ${code}"
          if [ "${code}" -lt 200 ] || [ "${code}" -ge 400 ]; then
            echo "::error::Respuesta inesperada (${code}). Revisa que la web esté arriba y que Supabase no esté pausado."
            exit 1
          fi
          echo "Base despierta OK (la página pública consultó la base de datos)."
